<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode Traces</title>
<link rel="stylesheet" href="assets/style.css?v=10">
</head>
<body>
<div class="app">

  <!-- ============ 顶部 header ============ -->
  <header class="header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <!-- trace 折线图标 -->
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <path d="M1 8.5h3l1.8-5.5 3 11 1.8-5.5h5.4"
                stroke="#0d1117" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">OpenCode Traces</div>
        <div class="brand-sub">otel · opentelemetry viewer</div>
      </div>
    </div>
    <div class="stats-chips" id="stats-chips">
      <!-- 动态填充：今日 sessions / 今日 cost / 总 spans -->
    </div>
  </header>

  <!-- ============ 工具栏 ============ -->
  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input"
             placeholder="搜索 title / agent / model / session id…" autocomplete="off" />
    </div>

    <!-- Agent 类型过滤 -->
    <div class="toolbar-group">
      <span class="toolbar-label">Agent</span>
      <select class="toolbar-select" id="type-filter" title="Agent 类型">
        <option value="all" selected>全部</option>
        <option value="opencode">OpenCode</option>
        <option value="pi">PI</option>
      </select>
    </div>

    <!-- #5 时间范围 -->
    <div class="toolbar-group">
      <span class="toolbar-label">时间</span>
      <select class="toolbar-select" id="time-range" title="时间范围">
        <option value="today">今天</option>
        <option value="7d" selected>7天</option>
        <option value="30d">30天</option>
        <option value="all">全部</option>
      </select>
    </div>

    <!-- #5 刷新间隔 -->
    <div class="toolbar-group refresh-indicator" id="refresh-indicator">
      <span class="refresh-dot"></span>
      <select class="toolbar-select" id="refresh-interval" title="自动刷新">
        <option value="0">关闭</option>
        <option value="10">10秒</option>
        <option value="30" selected>30秒</option>
        <option value="60">60秒</option>
        <option value="300">5分钟</option>
      </select>
      <span id="refresh-text" class="refresh-text"></span>
    </div>
  </div>

  <!-- ============ 表格 ============ -->
  <div class="table-wrap">
    <div id="table-state"><!-- loading / empty / error 由 JS 注入 --></div>
    <table class="sessions" id="sessions-table" style="display:none">
      <thead>
        <tr>
          <th>Status</th>
          <th>Title</th>
          <th>Agent</th>
          <th>Model</th>
          <th>Profile</th>
          <th>Tokens (in→out)</th>
          <th>Cost</th>
          <th>Spans</th>
          <th>LLM</th>
          <th>Tools</th>
          <th>Last Seen</th>
        </tr>
      </thead>
      <tbody id="sessions-body"></tbody>
    </table>
    <div class="pagination" id="pagination" style="display:none">
      <span class="pagination-info" id="pagination-info"></span>
      <div class="pagination-controls">
        <button class="page-btn page-nav" id="page-prev" title="上一页" disabled>‹</button>
        <div class="page-numbers" id="page-numbers"></div>
        <button class="page-btn page-nav" id="page-next" title="下一页" disabled>›</button>
        <span class="page-size-group">
          <span class="page-size-label">每页</span>
          <select class="toolbar-select page-size-select" id="page-size-select" title="每页条数">
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </span>
      </div>
    </div>
  </div>

</div>

<script src="assets/utils.js?v=3"></script>
<script src="assets/app.js?v=10"></script>
</body>
</html>

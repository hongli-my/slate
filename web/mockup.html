<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate UI 方案</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f3; --surface-3:#e4e7ec;
  --text-1:#1d2129; --text-2:#4e5969; --text-3:#86909c;
  --border:#e5e6eb; --border-strong:#d1d5db;
  --accent:#165dff; --accent-bg:#e8f3ff; --accent-soft:#f2f7ff;
  --radius:8px; --radius-sm:6px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  --mono:'SF Mono','JetBrains Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:13px;color:var(--text-1);background:var(--bg)}

/* ===== 顶部 drag region ===== */
#drag-region{position:fixed;top:0;left:0;right:0;height:32px;z-index:9999;background:transparent}

/* ===== 方案切换栏 ===== */
.scheme-bar{position:fixed;top:32px;left:0;right:0;height:44px;display:flex;align-items:center;gap:8px;
  padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:100}
.scheme-bar .title{font-size:13px;font-weight:600;color:var(--text-1);margin-right:12px}
.scheme-bar .seg{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:2px}
.scheme-bar .seg button{border:0;background:transparent;padding:5px 14px;font-size:12px;font-weight:500;
  color:var(--text-2);border-radius:5px;cursor:pointer;transition:all .15s;font-family:var(--font)}
.scheme-bar .seg button.active{background:var(--surface);color:var(--text-1);box-shadow:var(--shadow-sm)}
.scheme-bar .hint{margin-left:auto;font-size:11px;color:var(--text-3)}

/* ===== 方案容器 ===== */
.stage{position:fixed;top:76px;left:0;right:0;bottom:0;overflow:hidden}
.scheme{display:none;width:100%;height:100%}
.scheme.active{display:flex}

/* ========== 方案A：左侧边栏 ========== */
.scheme-a{background:var(--bg)}
.scheme-a .sidebar{width:52px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px;flex-shrink:0}
.scheme-a .nav-btn{width:40px;height:40px;border:0;background:transparent;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--text-3);
  position:relative;transition:all .12s}
.scheme-a .nav-btn:hover{background:var(--surface-2);color:var(--text-1)}
.scheme-a .nav-btn.active{background:var(--accent-bg);color:var(--accent)}
.scheme-a .nav-btn.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--accent);border-radius:0 2px 2px 0}
.scheme-a .nav-btn .lbl{position:absolute;left:52px;background:var(--text-1);color:#fff;font-size:11px;
  padding:3px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:200}
.scheme-a .nav-btn:hover .lbl{opacity:1}
.scheme-a .sidebar .spacer{flex:1}
.scheme-a .content{flex:1;overflow:auto;position:relative}

/* ========== 方案B：顶部分段标签 ========== */
.scheme-b{flex-direction:column;background:var(--bg)}
.scheme-b .topbar{height:42px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scheme-b .seg-tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px}
.scheme-b .seg-tabs button{border:0;background:transparent;padding:6px 16px;font-size:12px;font-weight:500;
  color:var(--text-2);border-radius:5px;cursor:pointer;transition:all .15s;font-family:var(--font);
  display:flex;align-items:center;gap:6px}
.scheme-b .seg-tabs button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.scheme-b .content{flex:1;overflow:auto;position:relative}

/* ========== 方案C：编辑器+抽屉 ========== */
.scheme-c{background:var(--bg);position:relative}
.scheme-c .main{flex:1;display:flex;overflow:hidden;transition:margin-right .25s ease}
.scheme-c .main.with-drawer{margin-right:380px}
.scheme-c .drawer{position:absolute;top:0;right:0;bottom:0;width:380px;background:var(--surface);
  border-left:1px solid var(--border);transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;z-index:50}
.scheme-c .drawer.open{transform:translateX(0);box-shadow:var(--shadow-md)}
.scheme-c .drawer-head{height:42px;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.scheme-c .drawer-head .dtab{border:0;background:transparent;padding:5px 10px;font-size:12px;font-weight:500;
  color:var(--text-3);border-radius:5px;cursor:pointer;font-family:var(--font)}
.scheme-c .drawer-head .dtab.active{background:var(--accent-bg);color:var(--accent)}
.scheme-c .drawer-head .close{margin-left:auto;border:0;background:transparent;font-size:16px;cursor:pointer;
  color:var(--text-3);width:28px;height:28px;border-radius:5px}
.scheme-c .drawer-head .close:hover{background:var(--surface-2)}
.scheme-c .drawer-body{flex:1;overflow:auto}
.scheme-c .drawer-toggle{position:absolute;top:8px;right:12px;display:flex;gap:4px;z-index:60}
.scheme-c .drawer-toggle button{width:32px;height:32px;border:0;background:var(--surface-2);border-radius:var(--radius-sm);
  font-size:14px;cursor:pointer;color:var(--text-3);display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);transition:all .12s}
.scheme-c .drawer-toggle button:hover{background:var(--surface-3);color:var(--text-1)}
.scheme-c .drawer-toggle button.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bg)}

/* ===== 功能内容占位（共享） ===== */
/* 编辑器占位 */
.fn-editor{display:none;height:100%;flex-direction:row}
.fn-editor.active{display:flex}
.fn-editor .tree{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:8px 0;overflow:auto}
.fn-editor .tree .grp{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;
  padding:8px 14px 4px;letter-spacing:.5px}
.fn-editor .tree .item{padding:4px 14px 4px 28px;font-size:12px;color:var(--text-2);cursor:pointer;border-radius:0;
  display:flex;align-items:center;gap:6px}
.fn-editor .tree .item:hover{background:var(--surface-2)}
.fn-editor .tree .item.sel{background:var(--accent-bg);color:var(--accent)}
.fn-editor .tree .dir{padding-left:14px;font-weight:500;color:var(--text-1)}
.fn-editor .edit-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.fn-editor .tab-row{height:34px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;flex-shrink:0}
.fn-editor .tab-row .tab{padding:0 14px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);
  border-right:1px solid var(--border);cursor:pointer}
.fn-editor .tab-row .tab.active{color:var(--text-1);background:var(--bg);border-bottom:2px solid var(--accent)}
.fn-editor .code{flex:1;background:var(--surface);padding:12px 16px;font-family:var(--mono);font-size:12.5px;
  line-height:1.7;color:var(--text-1);overflow:auto;white-space:pre}
.fn-editor .code .kw{color:#722ed1} .fn-editor .code .str{color:#0fc6c2} .fn-editor .code .cm{color:var(--text-3)}
.fn-editor .code .fn{color:#165dff}

/* OneTab 占位 */
.fn-onetab{display:none;height:100%;overflow:auto;padding:16px 20px;background:var(--bg)}
.fn-onetab.active{display:block}
.fn-onetab .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .15s}
.fn-onetab .card:hover{box-shadow:var(--shadow-md)}
.fn-onetab .card .ct{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fn-onetab .card .meta{font-size:11px;color:var(--text-3)}
.fn-onetab .card .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fn-onetab .card .link{font-size:11px;color:var(--text-2);background:var(--surface-2);padding:3px 8px;
  border-radius:4px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* OTel 占位 */
.fn-otel{display:none;height:100%;overflow:auto;padding:16px 20px;background:var(--bg)}
.fn-otel.active{display:block}
.fn-otel .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.fn-otel .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.fn-otel .stat .lab{font-size:11px;color:var(--text-3);margin-bottom:6px}
.fn-otel .stat .val{font-size:22px;font-weight:700;color:var(--text-1)}
.fn-otel .stat .delta{font-size:11px;margin-top:4px}
.fn-otel .stat .delta.up{color:#f53f3f} .fn-otel .stat .delta.dn{color:#00b42a}
.fn-otel .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.fn-otel .panel .ph{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fn-otel .chart{height:120px;display:flex;align-items:flex-end;gap:3px;padding:0 4px}
.fn-otel .chart .bar{flex:1;background:linear-gradient(180deg,var(--accent),#85b7ff);border-radius:2px 2px 0 0;min-height:4px;opacity:.85}
.fn-otel .trace-list{width:100%;border-collapse:collapse;font-size:12px}
.fn-otel .trace-list th{text-align:left;font-weight:500;color:var(--text-3);padding:6px 8px;border-bottom:1px solid var(--border)}
.fn-otel .trace-list td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text-2)}
.fn-otel .trace-list .svc{font-weight:500;color:var(--text-1)}
.fn-otel .badge{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500}
.fn-otel .badge.ok{background:#e8ffea;color:#00b42a} .fn-otel .badge.err{background:#ffece8;color:#f53f3f}

/* 对话占位 */
.fn-chat{display:none;height:100%;flex-direction:column;background:var(--bg)}
.fn-chat.active{display:flex}
.fn-chat .msgs{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.fn-chat .msg{max-width:74%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6}
.fn-chat .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.fn-chat .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.fn-chat .msg .who{font-size:10px;font-weight:600;color:var(--text-3);margin-bottom:3px}
.fn-chat .msg.me .who{color:rgba(255,255,255,.7)}
.fn-chat .input{height:52px;border-top:1px solid var(--border);background:var(--surface);display:flex;
  align-items:center;gap:8px;padding:0 16px;flex-shrink:0}
.fn-chat .input input{flex:1;border:1px solid var(--border);border-radius:var(--radius);height:34px;
  padding:0 12px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg)}
.fn-chat .input input:focus{border-color:var(--accent)}
.fn-chat .input button{border:0;background:var(--accent);color:#fff;height:34px;padding:0 16px;
  border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font)}
</style>
</head>
<body>

<div id="drag-region"></div>

<!-- 方案切换 -->
<div class="scheme-bar">
  <span class="title">Slate UI 方案</span>
  <div class="seg" id="schemeSeg">
    <button class="active" data-s="a">A · 侧边栏</button>
    <button data-s="b">B · 顶栏标签</button>
    <button data-s="c">C · 编辑器+抽屉</button>
  </div>
  <span class="hint">点切换方案，点导航切换功能</span>
</div>

<div class="stage">

<!-- ============ 方案 A ============ -->
<div class="scheme scheme-a active" id="scheme-a">
  <div class="sidebar">
    <button class="nav-btn active" data-sa="editor">📄<span class="lbl">编辑器</span></button>
    <button class="nav-btn" data-sa="onetab">📑<span class="lbl">OneTab</span></button>
    <button class="nav-btn" data-sa="otel">🔍<span class="lbl">OTel</span></button>
    <button class="nav-btn" data-sa="chat">💬<span class="lbl">对话</span></button>
    <div class="spacer"></div>
    <button class="nav-btn">⚙️<span class="lbl">设置</span></button>
  </div>
  <div class="content" id="content-a"></div>
</div>

<!-- ============ 方案 B ============ -->
<div class="scheme scheme-b" id="scheme-b">
  <div class="topbar">
    <div class="seg-tabs" id="seg-b">
      <button class="active" data-sb="editor">📄 编辑器</button>
      <button data-sb="onetab">📑 OneTab</button>
      <button data-sb="otel">🔍 OTel</button>
      <button data-sb="chat">💬 对话</button>
    </div>
  </div>
  <div class="content" id="content-b"></div>
</div>

<!-- ============ 方案 C ============ -->
<div class="scheme scheme-c" id="scheme-c">
  <div class="drawer-toggle">
    <button class="active" data-sc-toggle>📋</button>
  </div>
  <div class="main" id="main-c">
    <div style="flex:1;overflow:hidden" id="content-c"></div>
  </div>
  <div class="drawer open" id="drawer-c">
    <div class="drawer-head">
      <button class="dtab" data-sc="onetab">📑 OneTab</button>
      <button class="dtab active" data-sc="otel">🔍 OTel</button>
      <button class="dtab" data-sc="chat">💬 对话</button>
      <button class="close" id="close-drawer">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body-c"></div>
  </div>
</div>

</div><!-- /stage -->

<script>
/* ===== 功能内容模板 ===== */
const editorHTML = `<div class="fn-editor active">
  <div class="tree">
    <div class="grp">项目</div>
    <div class="item dir">📁 src</div>
    <div class="item">📄 main.rs</div>
    <div class="item sel">📄 lib.rs</div>
    <div class="item">📄 Cargo.toml</div>
    <div class="grp">文档</div>
    <div class="item dir">📁 notes</div>
    <div class="item">📄 README.md</div>
    <div class="item">📄 api.md</div>
  </div>
  <div class="edit-area">
    <div class="tab-row">
      <div class="tab active">📄 lib.rs</div>
      <div class="tab">📄 main.rs</div>
    </div>
    <div class="code"><span class="kw">use</span> tauri::{Manager, Runtime};

<span class="kw">fn</span> <span class="fn">build_menu</span>&lt;R: Runtime&gt;(app: &amp;AppHandle&lt;R&gt;) -&gt; <span class="kw">Result</span>&lt;Menu&lt;R&gt;&gt; {
    <span class="kw">let</span> app_submenu = <span class="fn">Submenu::with_items</span>(app, <span class="str">"Slate"</span>, <span class="kw">true</span>, &amp;[
        <span class="cm">// 菜单项...</span>
    ])?;
    <span class="kw">Ok</span>(<span class="fn">Menu::with_items</span>(app, &amp;[&amp;app_submenu]))
}</div>
  </div>
</div>`;

const onetabHTML = `<div class="fn-onetab active">
  <div class="card">
    <div class="ct">📑 Tauri 开发资料 <span class="meta">· 12 个标签 · 2小时前</span></div>
    <div class="links">
      <span class="link">Tauri v2 官方文档</span>
      <span class="link">tauri-apps/plugins-workspace</span>
      <span class="link">CodeMirror 5 docs</span>
      <span class="link">Rust async 编程指南</span>
    </div>
  </div>
  <div class="card">
    <div class="ct">📑 StarRocks 诊断笔记 <span class="meta">· 8 个标签 · 昨天</span></div>
    <div class="links">
      <span class="link">BE CPU 诊断 skill</span>
      <span class="link">Routine Load 排障</span>
      <span class="link">FE Full GC 分析</span>
    </div>
  </div>
  <div class="card">
    <div class="ct">📑 周末读的论文 <span class="meta">· 5 个标签 · 3天前</span></div>
    <div class="links">
      <span class="link">Attention Is All You Need</span>
      <span class="link">LLM 推理优化综述</span>
    </div>
  </div>
</div>`;

const otelHTML = `<div class="fn-otel active">
  <div class="stats">
    <div class="stat"><div class="lab">请求数 / min</div><div class="val">12,847</div><div class="delta dn">↓ 3.2%</div></div>
    <div class="stat"><div class="lab">P99 延迟</div><div class="val">184<span style="font-size:13px">ms</span></div><div class="delta up">↑ 8ms</div></div>
    <div class="stat"><div class="lab">错误率</div><div class="val">0.12<span style="font-size:13px">%</span></div><div class="delta dn">↓ 0.05%</div></div>
    <div class="stat"><div class="lab">活跃 Trace</div><div class="val">326</div><div class="delta up">↑ 12</div></div>
  </div>
  <div class="panel">
    <div class="ph">📊 延迟分布（近1小时）</div>
    <div class="chart" id="chart-a"></div>
  </div>
  <div class="panel">
    <div class="ph"> 🔍 最近 Trace</div>
    <table class="trace-list">
      <tr><th>服务</th><th>操作</th><th>延迟</th><th>状态</th><th>时间</th></tr>
      <tr><td class="svc">query-service</td><td>SELECT * FROM ...</td><td>42ms</td><td><span class="badge ok">OK</span></td><td>10:24:31</td></tr>
      <tr><td class="svc">load-router</td><td>stream_load</td><td>1.2s</td><td><span class="badge ok">OK</span></td><td>10:24:28</td></tr>
      <tr><td class="svc">fe-meta</td><td>publish_version</td><td>—</td><td><span class="badge err">ERR</span></td><td>10:24:15</td></tr>
      <tr><td class="svc">query-service</td><td>INSERT INTO ...</td><td>380ms</td><td><span class="badge ok">OK</span></td><td>10:24:02</td></tr>
    </table>
  </div>
</div>`;

const chatHTML = `<div class="fn-chat active">
  <div class="msgs">
    <div class="msg ai"><div class="who">Slate AI</div>你好，有什么可以帮你的？我可以帮你分析代码、查诊断资料、写脚本。</div>
    <div class="msg me"><div class="who">你</div>帮我看看 lib.rs 的菜单结构有没有问题</div>
    <div class="msg ai"><div class="who">Slate AI</div>看了你的 lib.rs，菜单结构没问题。Submenu::with_items 的泛型参数 R: Runtime 写法正确，on_menu_event 的 match 分支也覆盖了所有自定义 id。一个小建议：reload 用的 eval 可以改成 emit + 前端 listen，一致性更好。</div>
    <div class="msg me"><div class="who">你</div>有道理，改一下</div>
  </div>
  <div class="input">
    <input placeholder="输入消息..." />
    <button>发送</button>
  </div>
</div>`;

const fns = { editor:editorHTML, onetab:onetabHTML, otel:otelHTML, chat:chatHTML };

/* ===== 方案切换 ===== */
document.getElementById('schemeSeg').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#schemeSeg button').forEach(b=>b.classList.toggle('active',b===e.target));
  document.querySelectorAll('.scheme').forEach(s=>s.classList.toggle('active', s.id==='scheme-'+e.target.dataset.s));
  renderAll();
});

/* 方案A导航 */
document.querySelector('#scheme-a .sidebar').addEventListener('click',e=>{
  const b=e.target.closest('.nav-btn'); if(!b||!b.dataset.sa)return;
  document.querySelectorAll('#scheme-a .nav-btn').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('content-a').innerHTML=fns[b.dataset.sa];
  afterRender(b.dataset.sa);
});

/* 方案B导航 */
document.getElementById('seg-b').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#seg-b button').forEach(b=>b.classList.toggle('active',b===e.target));
  document.getElementById('content-b').innerHTML=fns[e.target.dataset.sb];
  afterRender(e.target.dataset.sb);
});

/* 方案C抽屉切换 */
document.querySelectorAll('[data-sc]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-sc]').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('drawer-body-c').innerHTML=fns[b.dataset.sc];
  afterRender(b.dataset.sc);
}));
document.getElementById('close-drawer').addEventListener('click',()=>{
  document.getElementById('drawer-c').classList.remove('open');
  document.getElementById('main-c').classList.remove('with-drawer');
  document.querySelector('[data-sc-toggle]').classList.remove('active');
});
document.querySelector('[data-sc-toggle]').addEventListener('click',()=>{
  const d=document.getElementById('drawer-c');
  const open=!d.classList.contains('open');
  d.classList.toggle('open',open);
  document.getElementById('main-c').classList.toggle('with-drawer',open);
  document.querySelector('[data-sc-toggle]').classList.toggle('active',open);
});

/* ===== 渲染 ===== */
function renderAll(){
  // A
  const sa=document.querySelector('#scheme-a .nav-btn.active')?.dataset.sa||'editor';
  document.getElementById('content-a').innerHTML=fns[sa]; afterRender(sa);
  // B
  const sb=document.querySelector('#seg-b button.active')?.dataset.sb||'editor';
  document.getElementById('content-b').innerHTML=fns[sb]; afterRender(sb);
  // C: main=editor always, drawer=otel default
  document.getElementById('content-c').innerHTML=fns.editor; afterRender('editor');
  const sc=document.querySelector('[data-sc].active')?.dataset.sc||'otel';
  document.getElementById('drawer-body-c').innerHTML=fns[sc]; afterRender(sc);
}

function afterRender(fn){
  if(fn==='otel'){
    document.querySelectorAll('.chart').forEach(c=>{
      if(c.children.length) return;
      for(let i=0;i<40;i++){
        const b=document.createElement('div');b.className='bar';
        b.style.height=(20+Math.random()*80)+'%';c.appendChild(b);
      }
    });
  }
}

renderAll();
</script>
</body>
</html>
